<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Track your weekly DSA, Git, technical interview, and machine-coding preparation." />

  <meta name="theme-color" content="#4338ca" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <title>Interview Practice Tracker</title>

  <script>
    // Apply the saved/preferred theme before React mounts so the page
    // never flashes the wrong theme on load. Keep this key in sync with
    // THEME_STORAGE_KEY in src/hooks/useTheme.js.
    (function () {
      try {
        var stored = localStorage.getItem(
          "interview-practice-tracker:theme",
        );
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";

        document.documentElement.setAttribute("data-theme", theme);
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
